<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>paperclip-plugin-agent-usage</title>
  <!-- Rounded square — Paperclip pink -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#db2777"/>
  <!-- Stacked usage bars (quotas) -->
  <g fill="#ffffff">
    <rect x="60" y="80"  width="136" height="22" rx="6"/>
    <rect x="60" y="116" width="108" height="22" rx="6"/>
    <rect x="60" y="152" width="148" height="22" rx="6" opacity="0.45"/>
  </g>
  <!-- Small caret indicator on the right of the second (warning) bar -->
  <circle cx="186" cy="127" r="8" fill="#ffffff"/>
</svg>
