name: Release

# Releasing is the version bump. Merge a PR that raises `version` in
# package.json and this publishes it; merge anything else and this is a no-op.
# npm is the gate, not git tags, because npm is what operators install from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is the repo version unpublished?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - id: check
        name: Compare package.json against the registry
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # --prefer-online or the runner's packument cache can replay a
          # pre-publish view. The decision logic lives in
          # scripts/release-check.mjs so it can be unit tested.
          code=0
          npm view --prefer-online "$name" versions --json >/tmp/npm-view.out 2>/tmp/npm-view.err || code=$?
          result=$(node scripts/release-check.mjs "$name" "$version" "$code" /tmp/npm-view.out /tmp/npm-view.err)
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "::notice::$name@$version: $result"

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    # The `npm-publish` environment is where the publish credential lives,
    # either an NPM_TOKEN secret or the trusted-publisher registration on
    # npmjs.com. It also carries a required reviewer while LAC-6116 holds the
    # 0.1.5 publish approval, so until that clears this job parks on a review
    # request instead of publishing. Drop the reviewer once 0.1.5 is out or
    # every release needs a click, which is the thing this workflow exists to
    # remove.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1. npm >= 11.16 also blocks
      # install scripts by default, which leaves esbuild's postinstall unrun;
      # measured 2026-10-28 on npm 11, the build resolves its platform binary
      # from the optional dependency anyway and typecheck, all tests and all
      # three bundles still pass. Stay on the measured major: `latest` is
      # already 12. The manifest check below catches a later 11.x default change.
      - run: npm install -g 'npm@^11.5.1'

      - run: npm -v

      # A release builds from the lockfile. `npm install` may silently resolve a
      # newer tree than the one CI tested on the PR, and `@paperclipai/plugin-sdk`
      # is a `latest` range.
      - run: npm ci

      - name: Guard against PLUGIN_VERSION drift
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          src=$(grep -oE 'PLUGIN_VERSION = "[^"]+"' src/constants.ts | grep -oE '[0-9][^"]*')
          if [ "$pkg" != "$src" ]; then
            echo "package.json is $pkg but src/constants.ts PLUGIN_VERSION is $src" >&2
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify plugin manifest bundle
        run: |
          test -f dist/manifest.js
          test -f dist/worker.js
          test -f dist/ui/index.js

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Empty when the package uses npm trusted publishing; the OIDC
          # token from `id-token: write` authenticates instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Runs whenever the version is on npm (just published, or published by an
  # earlier run whose tag push failed) and the tag is missing. Idempotent, so a
  # failed tag push heals on the next push to main or a manual dispatch.
  tag:
    name: Tag v${{ needs.check.outputs.version }}
    needs: [check, publish]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so git log -S can find the bump commit

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Ask the remote, not the checkout: actions/checkout fetches no tags,
          # so `git rev-parse v$VERSION` misses tags that do exist upstream and
          # the push below would then fail on an already-published release.
          # Tag the commit that set this version, not HEAD: a healing run can
          # fire several commits after the bump.
          sha=$(git log -S"\"version\": \"$VERSION\"" --reverse --format=%H -- package.json | head -n 1)
          if [ -z "$sha" ]; then
            echo "::warning::No commit found that set version $VERSION; tagging $GITHUB_SHA"
            sha=$GITHUB_SHA
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin; leaving it alone."
          else
            git tag "v$VERSION" "$sha"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
          fi
